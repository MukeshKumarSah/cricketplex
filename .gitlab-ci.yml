image: whiteshadow1/gitlab-baseimage:v1
services:
  - docker:24.0.5-dind

variables:
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_TLS_VERIFY: 1
  DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  TAG_VERSION: "v$CI_PIPELINE_IID"

stages:
    - build
    - push
    - deploy


build:
    stage: build
    script:
        - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
        - docker build -t $DOCKER_USERNAME/cricketplex-frontend:$TAG_VERSION frontend/
        - docker tag $DOCKER_USERNAME/cricketplex-frontend:$TAG_VERSION $DOCKER_USERNAME/cricketplex-frontend:latest

        - docker build -t $DOCKER_USERNAME/cricketplex-backend:$TAG_VERSION backend/
        - docker tag $DOCKER_USERNAME/cricketplex-backend:$TAG_VERSION $DOCKER_USERNAME/cricketplex-backend:latest

        - docker images

push:
    stage: push
    needs: ["build"]
    script:
        - docker images 
        - docker login -u "$DOCKER_USERNAME" -p "$DOCKER_PASSWORD"
        - docker push $DOCKER_USERNAME/cricketplex-frontend:$TAG_VERSION
        - docker push $DOCKER_USERNAME/cricketplex-frontend:latest
        - docker push $DOCKER_USERNAME/cricketplex-backend:$TAG_VERSION
        - docker push $DOCKER_USERNAME/cricketplex-backend:latest


