image: whiteshadow1/gitlab-baseimage:v1
services:
  - docker:24.0.5-dind

variables:
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_TLS_VERIFY: 1
  DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  IMAGE: frontend

stages:
    - buildAndPush
    - deploy


buildAndPush:
    stage: buildAndPush
    script:
        - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
        - docker build -t $DOCKER_USERNAME/$IMAGE:v1 frontend/
        - docker push $DOCKER_USERNAME/$IMAGE:v1


deploy:
    stage: deploy
    script:
        - sed -i 's,'repo/imagename','$DOCKER_USERNAME/$IMAGE:v1',g' deployment.yaml 
        - cp $KUBE_CONFIG ~/.kube/config
        - kubectl get nodes
        - kubectl apply -f deployment.yaml
