server {
    listen 80;
    # Catch-all: works for localhost, cricketplex.com, or any domain pointed at this server.
    # TLS termination (HTTPS) should be handled by an upstream reverse proxy
    # (e.g. Nginx Proxy Manager, Caddy, Cloudflare Tunnel) — not here.
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Handle React/Vite client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the API gateway
    location /api/ {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    # Proxy WebSocket connections to social-service via gateway
    location /ws/ {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /ws {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
