services:
  postgres:
    image: postgres:16-alpine
    container_name: cricketplex-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cricketplex
      POSTGRES_USER: cricketplex
      POSTGRES_PASSWORD: cricketplex_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: cricketplex-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
