services:
  postgres:
    image: postgres:16-alpine
    container_name: cricketplex-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cricketplex
      POSTGRES_USER: cricketplex
      POSTGRES_PASSWORD: cricketplex_secret
    ports:
      - "5433:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cricketplex"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: cricketplex-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - miniodata_dev:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE: auth-service
    container_name: cricketplex-auth
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      game-service:
        condition: service_healthy
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      APP_BASE_URL: https://${DOMAIN}
      APP_FRONTEND_URL: https://${DOMAIN}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      APP_SEASON1_START: ${APP_SEASON1_START:-2026-04-26}
      APP_RAZORPAY_KEY_ID: ${APP_RAZORPAY_KEY_ID:-}
      APP_RAZORPAY_KEY_SECRET: ${APP_RAZORPAY_KEY_SECRET:-}
      APP_PAYPAL_CLIENT_ID: ${APP_PAYPAL_CLIENT_ID:-}
      APP_PAYPAL_CLIENT_SECRET: ${APP_PAYPAL_CLIENT_SECRET:-}
      APP_PAYPAL_MODE: ${APP_PAYPAL_MODE:-sandbox}
      APP_STRIPE_SECRET_KEY: ${APP_STRIPE_SECRET_KEY:-}
      APP_STRIPE_PUBLISHABLE_KEY: ${APP_STRIPE_PUBLISHABLE_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  game-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE: game-service
    container_name: cricketplex-game
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      APP_BASE_URL: https://${DOMAIN}
      APP_FRONTEND_URL: https://${DOMAIN}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      APP_SEASON1_START: ${APP_SEASON1_START:-2026-04-26}
      APP_SOCIAL_SERVICE_URL: http://social-service:8083
      APP_INTERNAL_API_KEY: ${APP_INTERNAL_API_KEY:-cricketplex-internal}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  social-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE: social-service
    container_name: cricketplex-social
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      game-service:
        condition: service_healthy
    environment:
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      APP_BASE_URL: https://${DOMAIN}
      APP_FRONTEND_URL: https://${DOMAIN}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      APP_SEASON1_START: ${APP_SEASON1_START:-2026-04-26}
      APP_INTERNAL_API_KEY: ${APP_INTERNAL_API_KEY:-cricketplex-internal}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: cricketplex-gateway
    restart: unless-stopped
    depends_on:
      auth-service:
        condition: service_healthy
      game-service:
        condition: service_healthy
      social-service:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cricketplex-frontend
    restart: unless-stopped
    depends_on:
      - gateway
    ports:
      - "3000:80"

volumes:
  pgdata_dev:
  miniodata_dev:
