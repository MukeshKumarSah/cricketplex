apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: cricketplex
  labels:
    app: gateway
    app.kubernetes.io/name: cricketplex
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: cricketplex
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    app: gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: cricketplex
  labels:
    app: gateway
    app.kubernetes.io/name: cricketplex
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: cricketplex
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
        app.kubernetes.io/name: cricketplex
        app.kubernetes.io/component: gateway
        app.kubernetes.io/part-of: cricketplex
    spec:
      containers:
        - name: gateway
          image: cricketplex/gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
