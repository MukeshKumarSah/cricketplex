apiVersion: v1
kind: Service
metadata:
  name: game-service
  namespace: cricketplex
  labels:
    app: game-service
    app.kubernetes.io/name: cricketplex
    app.kubernetes.io/component: game-service
    app.kubernetes.io/part-of: cricketplex
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8082
      targetPort: http
  selector:
    app: game-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-service
  namespace: cricketplex
  labels:
    app: game-service
    app.kubernetes.io/name: cricketplex
    app.kubernetes.io/component: game-service
    app.kubernetes.io/part-of: cricketplex
spec:
  replicas: 1
  selector:
    matchLabels:
      app: game-service
  template:
    metadata:
      labels:
        app: game-service
        app.kubernetes.io/name: cricketplex
        app.kubernetes.io/component: game-service
        app.kubernetes.io/part-of: cricketplex
    spec:
      containers:
        - name: game-service
          image: cricketplex/game-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
          env:
            - name: SERVER_PORT
              value: "8082"
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: cricketplex
                  key: SPRING_DATASOURCE_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: cricketplex
                  key: SPRING_DATASOURCE_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cricketplex
                  key: SPRING_DATASOURCE_PASSWORD
            - name: MINIO_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: cricketplex
                  key: MINIO_ENDPOINT
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: cricketplex
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: cricketplex
                  key: MINIO_SECRET_KEY
            - name: APP_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: cricketplex
                  key: APP_BASE_URL
            - name: APP_FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: cricketplex
                  key: APP_FRONTEND_URL
            - name: APP_CORS_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: cricketplex
                  key: APP_CORS_ALLOWED_ORIGINS
            - name: APP_SEASON1_START
              valueFrom:
                configMapKeyRef:
                  name: cricketplex
                  key: APP_SEASON1_START
            - name: APP_SOCIAL_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: cricketplex
                  key: APP_SOCIAL_SERVICE_URL
            - name: APP_INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cricketplex
                  key: APP_INTERNAL_API_KEY
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 10
            initialDelaySeconds: 60
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
            initialDelaySeconds: 90
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
