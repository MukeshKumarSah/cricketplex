apiVersion: v1
kind: ConfigMap
metadata:
  name: cricketplex
  namespace: cricketplex
  labels:
    app.kubernetes.io/name: cricketplex
    app.kubernetes.io/part-of: cricketplex
data:
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cricketplex
  MINIO_ENDPOINT: http://minio:9000
  APP_BASE_URL: https://cricketplex.example.com
  APP_FRONTEND_URL: https://cricketplex.example.com
  APP_CORS_ALLOWED_ORIGINS: https://cricketplex.example.com
  APP_SEASON1_START: "2026-04-26"
  APP_MAIL_FROM: no-reply@mukoraonline.pw
  APP_MAIL_SENDER_NAME: CricketPlex
  APP_BREVO_API_URL: https://api.brevo.com/v3/smtp/email
  APP_PAYPAL_MODE: sandbox
  APP_SOCIAL_SERVICE_URL: http://social-service:8083
  INGRESS_HOST: cricketplex.example.com
