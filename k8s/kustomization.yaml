apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cricketplex

resources:
  - namespace.yaml
  - secret.yaml
  - configmap.yaml
  - postgres.yaml
  - minio.yaml
  - game-service.yaml
  - auth-service.yaml
  - social-service.yaml
  - gateway.yaml
  - frontend.yaml
  - ingress.yaml

images:
  - name: cricketplex/auth-service
    newTag: latest
  - name: cricketplex/game-service
    newTag: latest
  - name: cricketplex/social-service
    newTag: latest
  - name: cricketplex/gateway
    newTag: latest
  - name: cricketplex/frontend
    newTag: latest
