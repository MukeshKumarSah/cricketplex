apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: cricketplex
  labels:
    app: frontend
    app.kubernetes.io/name: cricketplex
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: cricketplex
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    app: frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: cricketplex
  labels:
    app: frontend
    app.kubernetes.io/name: cricketplex
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: cricketplex
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        app.kubernetes.io/name: cricketplex
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: cricketplex
    spec:
      containers:
        - name: frontend
          image: cricketplex/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
