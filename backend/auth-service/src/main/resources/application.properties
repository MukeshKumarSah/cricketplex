spring.application.name=auth-service
server.port=${SERVER_PORT:8081}

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cricketdemo}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin123}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway runs only in game-service
spring.flyway.enabled=false

# JWT
app.jwt.secret=Y3JpY2tldHBsZXgtc3VwZXItc2VjcmV0LWtleS1mb3Itand0LXRva2VuLWdlbmVyYXRpb24tMjAyNg==
app.jwt.expiration-ms=86400000

# MinIO
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:admin}
minio.secret-key=${MINIO_SECRET_KEY:admin123}
minio.bucket-name=cricketplex

# Season
app.season1-start=${APP_SEASON1_START:2026-04-09}

# App
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
app.mail.from=${APP_MAIL_FROM:no-reply@mukoraonline.pw}
app.mail.sender-name=${APP_MAIL_SENDER_NAME:CricketPlex}
app.brevo.api-key=${APP_BREVO_API_KEY:}
app.brevo.api-url=${APP_BREVO_API_URL:https://api.brevo.com/v3/smtp/email}

# Razorpay (Supporter subscriptions)
app.razorpay.key-id=${APP_RAZORPAY_KEY_ID:}
app.razorpay.key-secret=${APP_RAZORPAY_KEY_SECRET:}

# PayPal
app.paypal.client-id=${APP_PAYPAL_CLIENT_ID:}
app.paypal.client-secret=${APP_PAYPAL_CLIENT_SECRET:}
app.paypal.mode=${APP_PAYPAL_MODE:sandbox}

# Stripe
app.stripe.secret-key=${APP_STRIPE_SECRET_KEY:}
app.stripe.publishable-key=${APP_STRIPE_PUBLISHABLE_KEY:}

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost}

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Only auth-service writes lastActiveAt to avoid cross-service row contention
app.track-last-active=true
