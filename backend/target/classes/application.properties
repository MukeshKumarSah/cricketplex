spring.application.name=CricketPlex

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/cricketdemo
spring.datasource.username=admin
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.postgresql.Driver
# Connection pool — sized for 32 parallel fast-forward threads + normal app traffic
spring.datasource.hikari.maximum-pool-size=40
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT
app.jwt.secret=Y3JpY2tldHBsZXgtc3VwZXItc2VjcmV0LWtleS1mb3Itand0LXRva2VuLWdlbmVyYXRpb24tMjAyNg==
app.jwt.expiration-ms=86400000

# MinIO
minio.endpoint=http://localhost:9000
minio.access-key=admin
minio.secret-key=admin123
minio.bucket-name=cricketplex

# Server
server.port=8080

# App
app.base-url=http://localhost:8080

# CORS
app.cors.allowed-origins=http://localhost:5173
