spring.application.name=CricketPlex

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cricketdemo}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin123}
spring.datasource.driver-class-name=org.postgresql.Driver
# Connection pool — sized for 32 parallel fast-forward threads + normal app traffic
spring.datasource.hikari.maximum-pool-size=40
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT
app.jwt.secret=Y3JpY2tldHBsZXgtc3VwZXItc2VjcmV0LWtleS1mb3Itand0LXRva2VuLWdlbmVyYXRpb24tMjAyNg==
app.jwt.expiration-ms=86400000

# MinIO
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:admin}
minio.secret-key=${MINIO_SECRET_KEY:admin123}
minio.bucket-name=cricketplex

# Season
# Season 1 start date — change this per environment without touching code.
# Format: YYYY-MM-DD
app.season1-start=${APP_SEASON1_START:2026-04-09}

# App
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
app.mail.from=${APP_MAIL_FROM:no-reply@mukoraonline.pw}
app.mail.sender-name=${APP_MAIL_SENDER_NAME:CricketPlex}
app.brevo.api-key=${APP_BREVO_API_KEY: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}
